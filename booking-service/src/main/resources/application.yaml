server:
  port: 8080
  tomcat:
    max-http-form-post-size: 2MB

spring:
  application:
    name: booking-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
        show-sql: true
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  openapi:
    spec-path: "booking-openapi.yaml"
    max-body-size: "2MB"
  cors:
    allowed-origin: ${APP_CORS_ALLOWED_ORIGIN:http://localhost:3000}

logging:
  level:
    com:
      atlassian:
        oai: DEBUG

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
      show-components: always
      probes:
        enabled: true
      group:
        readiness:
          include: db,redis,readinessState
  health:
    db:
      enabled: true
    redis:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true