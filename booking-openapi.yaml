openapi: 3.0.3
info:
  title: Room Booking API
  version: 1.0.0
  description: API для системы бронирования переговорных комнат
paths:
  /api/v1/rooms:
    get:
      summary: Получить список всех переговорных
      responses:
        '200':
          description: Успешный ответ со списком комнат
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Room'

  /api/v1/rooms/{roomId}/availability:
    get:
      summary: Получить расписание занятости комнаты на дату
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: integer
        - name: date
          in: query
          required: true
          description: Дата в формате YYYY-MM-DD
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TimeSlot'

  /api/v1/bookings:
    post:
      summary: Создать бронирование
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingRequest'
      responses:
        '201':
          description: Бронирование успешно создано
        '400':
          description: Ошибка валидации (неверный формат данных)
        '409':
          description: Конфликт (комната уже занята на это время)

    get:
      summary: Получить список бронирований текущего пользователя
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Успешный ответ

  /api/v1/bookings/{bookingId}:
    delete:
      summary: Отменить бронирование
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Бронирование успешно отменено
        '404':
          description: Бронирование не найдено

components:
  schemas:
    Room:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Альфа"
        capacity:
          type: integer
          example: 10
        equipment:
          type: array
          items:
            type: string
          example: ["Проектор", "Маркерная доска"]

    TimeSlot:
      type: object
      properties:
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        isAvailable:
          type: boolean

    BookingRequest:
      type: object
      required:
        - roomId
        - userId
        - startTime
        - endTime
      properties:
        roomId:
          type: integer
          example: 1
        userId:
          type: integer
          example: 42
        startTime:
          type: string
          format: date-time
          example: "2026-04-12T10:00:00Z"
        endTime:
          type: string
          format: date-time
          example: "2026-04-12T11:00:00Z"