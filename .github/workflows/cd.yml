name: CD Room Booking

on:
  push:
    branches:
      - develop
      - main
      - test-cd

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: java-masterskaya/room-booking-system

    steps:
      # =========================
      # 1. Checkout
      # =========================
      - name: Checkout code
        uses: actions/checkout@v4

      # =========================
      # 2. Define tag (NO bash state)
      # =========================
      - name: Compute image tag
        id: vars
        run: |
          echo "tag=${GITHUB_REF_NAME}-${GITHUB_SHA}" >> $GITHUB_OUTPUT

      # =========================
      # 3. Setup Java
      # =========================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      # =========================
      # 3. Setup Java
      # =========================
      - name: Make mvnw executable
        run: chmod +x mvnw

      # =========================
      # 4. Build JAR
      # =========================
      - name: Build JAR
        run: ./mvnw clean package -DskipTests

      # =========================
      # 6. Login GHCR
      # =========================
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # =========================
      # 7. Build Docker image
      # =========================
      - name: Build Docker image
        run: |
          IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          TAG=${{ steps.vars.outputs.tag }}

          docker build \
            -f booking-service/Dockerfile \
            -t $IMAGE:$TAG \
            booking-service
          
          docker tag $IMAGE:$TAG $IMAGE:latest

      # =========================
      # 8. Prepare server directories and copy configs
      # =========================

      - name: Prepare server directories
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            mkdir -p /opt/room-booking/config
            mkdir -p /opt/room-booking/scripts
            
      - name: Copy Prometheus config to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "config/prometheus.yml"
          target: "/opt/room-booking/config/"

      - name: Copy init scripts to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "scripts/create-topics.sh"
          target: "/opt/room-booking/scripts/"

      # =========================
      # 9. Push Docker image
      # =========================
      - name: Push Docker image
        run: |
          IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          TAG=${{ steps.vars.outputs.tag }}

          docker push $IMAGE:$TAG
          docker push $IMAGE:latest

      # =========================
      # 10. Deploy to server
      # =========================
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /opt/room-booking

            export TAG=${{ steps.vars.outputs.tag }}

            # 1. INFRA (всегда безопасно)
            docker compose -f infra-compose.yml up -d --wait
      
            # 2. INIT (idempotent jobs)
            docker compose -f init-compose.yml up -d
      
            # 3. APP
            docker compose up -d
      
            # 4. cleanup (важно)
            docker compose -f init-compose.yml rm -f || true