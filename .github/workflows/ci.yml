name: CI Room Booking

on:
  pull_request:
    branches: [ develop, main ]

  # ручной запуск из GitHub UI
  workflow_dispatch:
    inputs:
      run_integration:
        description: "Run integration tests (docker-compose)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  # =========================
  # 1. UNIT TESTS
  # =========================

  unit-tests:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.run_integration == 'false')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Create .env
        run: cp .env.example .env

      - name: Unit tests
        run: mvn clean test

  # =========================
  # 2. INTEGRATION (DOCKER-COMPOSE)
  # =========================

  integration-tests:
    runs-on: ubuntu-latest
    if: >
      github.base_ref == 'main' ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.run_integration == 'true')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Create .env
        run: cp .env.example .env

      - name: Build + package (all tests)
        run: mvn clean package

      - name: Verify booking-service artifact
        run: |
          if ! ls booking-service/target/*.jar 1> /dev/null 2>&1; then
            echo "::error::JAR not found in target/"
            exit 1
          fi
          ls -la booking-service/target/*.jar

      - name: Start docker stack
        run: docker compose up -d --build --wait --timeout 300

      - name: Health check with retry
        run: |
          for i in $(seq 1 30); do
            if curl -s --fail http://localhost:8080/actuator/health; then
              echo "::notice::Service healthy after $i attempts"
              exit 0
            fi
            echo "Attempt $i/30: not ready yet..."
            sleep 10
          done
          echo "::error::Service did not become healthy"
          exit 1

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v